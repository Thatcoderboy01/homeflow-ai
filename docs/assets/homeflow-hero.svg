<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">HomeFlow AI — Your Family's Action Agent</title>
  <desc id="d">Five stages: a natural-language request becomes a structured plan; a human approves or rejects it; only after the approval boundary are validated MCP tools executed; the result is persisted as household state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#121a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .title { font-size: 40px; font-weight: 700; fill: #f1f5f9; }
      .tag { font-size: 17px; fill: #94a3b8; }
      .node { fill: #0f172a; stroke: #334155; stroke-width: 1.5; }
      .human { stroke: #f59e0b; }
      .label { font-size: 14px; font-weight: 600; fill: #e2e8f0; text-anchor: middle; }
      .sub { font-size: 11px; fill: #94a3b8; text-anchor: middle; }
      .link { stroke: #475569; stroke-width: 2; }
      .gate { stroke: #f59e0b; stroke-width: 2; stroke-dasharray: 5 4; }
      .gatelabel { font-size: 11px; font-weight: 600; fill: #f59e0b; text-anchor: middle; letter-spacing: 1px; }
      .zone { font-size: 11px; fill: #64748b; text-anchor: middle; letter-spacing: 1.5px; }
      .glow { fill: none; stroke: url(#accent); stroke-width: 2.5; opacity: 0; animation: pulse 10s infinite; }
      .g2 { animation-delay: 2s; } .g3 { animation-delay: 4s; } .g4 { animation-delay: 6s; } .g5 { animation-delay: 8s; }
      @keyframes pulse { 0% {opacity:0} 4% {opacity:1} 18% {opacity:1} 24% {opacity:0} 100% {opacity:0} }
      @media (prefers-reduced-motion: reduce) { .glow { animation: none; opacity: 0; } }
    </style>
  </defs>

  <rect width="960" height="330" rx="16" fill="url(#bg)"/>
  <rect x="40" y="48" width="48" height="4" rx="2" fill="url(#accent)"/>
  <text x="40" y="96" class="title">HomeFlow AI</text>
  <text x="40" y="126" class="tag">Your Family's Action Agent. The AI proposes. You approve. Validated tools execute.</text>

  <!-- links -->
  <line x1="192" y1="205" x2="222" y2="205" class="link"/>
  <line x1="374" y1="205" x2="404" y2="205" class="link"/>
  <line x1="556" y1="205" x2="586" y2="205" class="link"/>
  <line x1="738" y1="205" x2="768" y2="205" class="link"/>

  <!-- approval boundary: between stage 3 and stage 4 -->
  <line x1="571" y1="160" x2="571" y2="262" class="gate"/>
  <text x="571" y="154" class="gatelabel">APPROVAL BOUNDARY</text>

  <!-- zones -->
  <text x="298" y="288" class="zone">PROPOSE</text>
  <text x="768" y="288" class="zone">EXECUTE</text>

  <!-- stage 1 -->
  <rect x="40" y="170" width="152" height="70" rx="12" class="node"/>
  <text x="116" y="199" class="label">1 · Request</text>
  <text x="116" y="219" class="sub">natural language</text>
  <rect x="40" y="170" width="152" height="70" rx="12" class="glow"/>
  <!-- stage 2 -->
  <rect x="222" y="170" width="152" height="70" rx="12" class="node"/>
  <text x="298" y="199" class="label">2 · Plan</text>
  <text x="298" y="219" class="sub">tasks + groceries</text>
  <rect x="222" y="170" width="152" height="70" rx="12" class="glow g2"/>
  <!-- stage 3 -->
  <rect x="404" y="170" width="152" height="70" rx="12" class="node human"/>
  <text x="480" y="199" class="label">3 · Human approval</text>
  <text x="480" y="219" class="sub">approve or reject</text>
  <rect x="404" y="170" width="152" height="70" rx="12" class="glow g3"/>
  <!-- stage 4 -->
  <rect x="586" y="170" width="152" height="70" rx="12" class="node"/>
  <text x="662" y="199" class="label">4 · MCP execution</text>
  <text x="662" y="219" class="sub">validated tools</text>
  <rect x="586" y="170" width="152" height="70" rx="12" class="glow g4"/>
  <!-- stage 5 -->
  <rect x="768" y="170" width="152" height="70" rx="12" class="node"/>
  <text x="844" y="199" class="label">5 · Persisted result</text>
  <text x="844" y="219" class="sub">household state</text>
  <rect x="768" y="170" width="152" height="70" rx="12" class="glow g5"/>
</svg>