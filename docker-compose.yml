# Optional: MySQL for local development. `docker compose up -d` (or `podman compose up -d`).
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: homeflow
      MYSQL_USER: homeflow
      MYSQL_PASSWORD: homeflow
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - homeflow-mysql:/var/lib/mysql
      - ./scripts/mysql-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro,Z
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  homeflow-mysql:
